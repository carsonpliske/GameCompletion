<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steam Game Organizer</title>
    <link rel="stylesheet" href="styles.css?v=41">
</head>
<body>
    <div id="loginGate" class="login-gate">
        <form id="loginGateForm" class="login-gate-card" onsubmit="handleLoginGateSubmit(event); return false;">
            <h1>🔒 Password Required</h1>
            <input type="password" id="loginGatePassword" placeholder="Password" autocomplete="current-password" autofocus>
            <button type="submit">Unlock</button>
            <div id="loginGateError" class="login-gate-error" hidden>Incorrect password.</div>
        </form>
    </div>
    <script>
        // Runs synchronously before the rest of the page paints, so an
        // already-unlocked browser never sees the gate flash on screen.
        if (localStorage.getItem('siteUnlocked') === 'true') {
            document.getElementById('loginGate').style.display = 'none';
        }
    </script>

    <canvas id="confetti-canvas"></canvas>
    <div id="floatingBackground" class="floating-background"></div>

    <div class="backup-container">
        <button type="button" class="backup-btn" title="Download a backup of your completed games, in-progress tracking, and Active Games list" onclick="exportGameData()">⬇️</button>
        <button type="button" class="backup-btn" title="Restore from a previously exported backup file" onclick="document.getElementById('importFileInput').click()">⬆️</button>
        <input type="file" id="importFileInput" accept="application/json,.json" hidden onchange="importGameData(event)">
    </div>

    <button id="todoSidebarToggle" class="todo-sidebar-toggle" title="Toggle Active Games list" onclick="toggleTodoSidebar()">🎯</button>
    <aside id="todoSidebar" class="todo-sidebar">
        <div class="todo-sidebar-header">
            <h2>🎯 Active Games <span id="todoCount" class="todo-count">0</span></h2>
            <button class="todo-sidebar-close" title="Hide this panel" onclick="toggleTodoSidebar()">✕</button>
        </div>
        <div id="todoList" class="todo-list" ondragover="handleTodoListDragOver(event)" ondrop="event.preventDefault()">
            <!-- Populated by renderTodoSidebar() -->
        </div>
    </aside>

    <button id="recentSidebarToggle" class="recent-sidebar-toggle" title="Toggle Recently Completed list" onclick="toggleRecentSidebar()">🏁</button>
    <aside id="recentSidebar" class="recent-sidebar">
        <div class="recent-sidebar-header">
            <h2>🏁 Recently Completed <span id="recentCount" class="recent-count">0</span></h2>
            <button class="recent-sidebar-close" title="Hide this panel" onclick="toggleRecentSidebar()">✕</button>
        </div>
        <div id="recentList" class="recent-list">
            <!-- Populated by renderRecentSidebar() -->
        </div>
    </aside>

    <div class="container">
        <header>
            <h1><img src="https://upload.wikimedia.org/wikipedia/commons/8/83/Steam_icon_logo.svg" alt="Steam Logo" style="height: 1em; vertical-align: middle; margin-right: 0.3em;"> Steam Game Organizer</h1>
            <p>Sort your Steam games by time to beat</p>
        </header>

        <div class="controls">
            <div class="search-container">
                <input type="text" id="searchInput" placeholder="Search games...">
            </div>
            <div class="sort-container">
                <label for="sortSelect">Sort by:</label>
                <select id="sortSelect">
                    <option value="name">Name</option>
                    <option value="mainTime">Main Story</option>
                    <option value="completionistTime">100% Complete</option>
                    <option value="achievements">Achievements</option>
                    <option value="releaseYear">Release Year</option>
                    <option value="completionDate">Completion Date</option>
                    <option value="myCompletionTime">My Completion Time</option>
                    <option value="achievementsRemaining">Closest to Completion</option>
                </select>
                <button id="sortDirectionBtn" class="sort-direction-btn" title="Toggle sort direction">
                    <span class="sort-arrow">▲</span>
                </button>
            </div>
            <div class="steam-sync-container">
                <button id="steamSyncBtn" class="steam-sync-btn" title="Pull achievement progress from Steam" onclick="syncWithSteam()">Sync with Steam</button>
                <span id="steamSyncStatus" class="steam-sync-status"></span>
            </div>
        </div>

        <div class="stats">
            <div class="stat-item">
                <span class="stat-label">Total Games:</span>
                <span id="totalGames">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Filtered:</span>
                <span id="filteredGames">0</span>
            </div>
            <div class="stat-item completed-stat" id="completedStatToggle" title="Click to show only completed games">
                <span class="stat-label">Completed:</span>
                <span id="completedGames">0</span>
            </div>
            <div class="stat-item inprogress-stat" id="inProgressStatToggle" title="Click to show only in-progress games">
                <span class="stat-label">In Progress:</span>
                <span id="inProgressGames">0</span>
            </div>
        </div>

        <div id="gamesList" class="games-list">
            <!-- Games will be populated here -->
        </div>
    </div>

    <script src="manualGameData.js?v=9"></script>
    <script src="hltbGameData.js?v=9"></script>
    <script src="achievementData.js?v=12"></script>
    <script src="achievementGuides.js?v=1"></script>
    <script src="script.js?v=53"></script>
</body>
</html>
